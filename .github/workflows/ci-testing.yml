name: CI - Test, Build & Push (testing branch)

on:
  push:
    branches: [ testing ]
  workflow_dispatch:

jobs:
  test:
    name: PyTests (matrix over services)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=12

      rabbitmq:
        image: rabbitmq:3
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s --health-timeout=5s --health-retries=12

    strategy:
      fail-fast: false
      matrix:
        include:
          - svc: product_service
            db: products
          - svc: customer_service
            db: customers
          - svc: order_service
            db: orders

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (+psql client)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential libpq-dev postgresql-client
          python -V

      - name: Install Python deps
        working-directory: backend/${{ matrix.svc }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          # ensure driver is present even if not pinned
          pip install "psycopg2-binary>=2.9"
          pip freeze | sort | sed -n '1,120p'

      - name: Wait for Postgres readiness
        run: |
          for i in {1..30}; do
            PGPASSWORD=postgres psql -h localhost -U postgres -p 5432 -d postgres -c "SELECT 1" && break
            echo "Postgres not ready yet..."; sleep 2
          done

      - name: Create DB ${{ matrix.db }}
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -p 5432 -d postgres -tc "SELECT 1 FROM pg_database WHERE datname='${{ matrix.db }}'" | grep -q 1 \
            || PGPASSWORD=postgres psql -h localhost -U postgres -p 5432 -d postgres -c "CREATE DATABASE ${{ matrix.db }};"

      - name: Initialize schema if app.db is present
        working-directory: backend/${{ matrix.svc }}
        env:
          POSTGRES_HOST: postgres
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ matrix.db }}
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/${{ matrix.db }}
          SQLALCHEMY_DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/${{ matrix.db }}
        run: |
          python - <<'PY'
          import os, sys
          sys.path.append(os.getcwd())
          try:
              from app.db import Base, engine
              Base.metadata.create_all(bind=engine)
              print("✅ Created tables via Base.metadata.create_all(...)")
          except Exception as e:
              print("ℹ️ Schema init skipped or not needed:", repr(e))
          PY

      - name: Run pytest (verbose)
        working-directory: backend/${{ matrix.svc }}
        env:
          TESTING: "1"
          POSTGRES_HOST: postgres
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ matrix.db }}
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/${{ matrix.db }}
          SQLALCHEMY_DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/${{ matrix.db }}
          RABBITMQ_HOST: rabbitmq
          RABBITMQ_PORT: 5672
          RABBITMQ_USER: guest
          RABBITMQ_PASS: guest
        run: |
          echo "Running tests for ${{ matrix.svc }} (DB=${{ matrix.db }})"
          pytest -vv -rA



  build_push:
    name: Build & Push images to ACR
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR login
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Set IMAGE_TAG
        id: vars
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Build & Push product_service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/product_service
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/product-service:${{ steps.vars.outputs.IMAGE_TAG }}
            ${{ secrets.ACR_LOGIN_SERVER }}/product-service:testing-latest

      - name: Build & Push customer_service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/customer_service
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/customer-service:${{ steps.vars.outputs.IMAGE_TAG }}
            ${{ secrets.ACR_LOGIN_SERVER }}/customer-service:testing-latest

      - name: Build & Push order_service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/order_service
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/order-service:${{ steps.vars.outputs.IMAGE_TAG }}
            ${{ secrets.ACR_LOGIN_SERVER }}/order-service:testing-latest

      - name: Build & Push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/frontend:${{ steps.vars.outputs.IMAGE_TAG }}
            ${{ secrets.ACR_LOGIN_SERVER }}/frontend:testing-latest
